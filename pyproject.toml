[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android-emulator-dock"
version = "1.0.0"
description = "Standalone native Wayland Linux application hosting multiple official Android Emulator instances in a unified workspace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Android Emulator Dock Contributors" }
]
keywords = [
    "android",
    "emulator",
    "wayland",
    "qt6",
    "grpc",
    "linux",
    "dock",
    "workspace"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    "PyQt6>=6.5.0",
    "grpcio>=1.50.0",
    "protobuf>=3.19.0",
]

[project.scripts]
android-emulator-dock = "aed.main:main"
aed = "aed.main:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aed*", "proto*"]
